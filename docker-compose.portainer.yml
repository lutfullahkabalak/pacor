# Portainer Stack deploy
# Repository: https://github.com/lutfullahkabalak/pacor
# Compose path: docker-compose.portainer.yml
# Ortam degiskenlerini .env.example dosyasindan Portainer stack editor'e ekleyin.

name: pacor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oruc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oruc}
      POSTGRES_DB: ${POSTGRES_DB:-oruc}
    volumes:
      - pacor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oruc -d oruc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pacor

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-oruc}:${POSTGRES_PASSWORD:-oruc}@db:5432/${POSTGRES_DB:-oruc}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-long-random-secret}
      PORT: "8080"
      SESSION_GAP_MINUTES: ${SESSION_GAP_MINUTES:-30}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-168}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pacor

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pacor

networks:
  pacor:
    driver: bridge

volumes:
  pacor_pgdata:
