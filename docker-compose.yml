# Lokal gelistirme / kaynak kodundan build.
# Tek domain mimarisi: nginx disari acik; / -> Vue SPA, /api/ -> backend.
# frontend/Dockerfile icinde nginx:alpine + nginx/default.conf kullanilir.
#
# Portainer uretim deploy icin: docker-compose.portainer.yml (GHCR image pull)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oruc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oruc}
      POSTGRES_DB: ${POSTGRES_DB:-oruc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oruc -d oruc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-oruc}:${POSTGRES_PASSWORD:-oruc}@db:5432/${POSTGRES_DB:-oruc}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: "8080"
      SESSION_GAP_MINUTES: ${SESSION_GAP_MINUTES:-30}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-168}
    ports:
      - "${BACKEND_PORT:-5844}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5843}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
